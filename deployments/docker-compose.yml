name: emailback

networks:
  backend: { driver: bridge }

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate-email:
    image: migrate/migrate:4
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    volumes:
      - ../db/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
      - "-verbose"
      - "up"
    restart: "no"

  migrate-auth:
    image: migrate/migrate:4
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    volumes:
      - ../db/auth_migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${AUTH_DB_NAME}?sslmode=disable"
      - "-verbose"
      - "up"
    restart: "no"

  auth:
    build:
      context: ../service/Auth
      dockerfile: Dockerfile
    image: auth-service:local
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${AUTH_DB_NAME}
      DB_SSLMODE: disable
      DB_MAX_CONNS: "20"
      DB_MIN_CONNS: "2"
      HTTP_HOST: ":8081"
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT}
      REDIS_ENABLED: "true"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "1"
      REDIS_PREFIX: "auth:"
      REDIS_TTL: "24h"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_ISSUER: emailback-auth
      LOG_LEVEL: info
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${AUTH_HOST_PORT:-8081}:8081"
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: service/EmailParse/Dockerfile
    image: emailback:local
    environment:
      STRICT: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      DB_MAX_CONNS: "20"
      DB_MIN_CONNS: "2"
      HTTP_HOST: ":8080"
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT}
      REDIS_ENABLED: "true"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_PREFIX: "emailback:"
      REDIS_TTL: "5m"
      AI_ENABLED: ${AI_ENABLED}
      AI_TIMEOUT: ${AI_TIMEOUT}
      AI_SUM_MODELS: ${AI_SUM_MODELS}
      AI_CLS_MODEL: ${AI_CLS_MODEL}
      HF_TOKEN: ${HF_TOKEN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      LOG_LEVEL: info
    depends_on:
      migrate-email:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  aiworker:
    image: emailback:local
    build:
      context: ..
      dockerfile: service/EmailParse/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      REDIS_ENABLED: "true"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_PREFIX: "emailback:"
      AI_ENABLED: ${AI_ENABLED}
      AI_TIMEOUT: ${AI_TIMEOUT}
      AI_SUM_MODELS: ${AI_SUM_MODELS}
      AI_CLS_MODEL: ${AI_CLS_MODEL}
      HF_TOKEN: ${HF_TOKEN}
      LOG_LEVEL: info
      METRICS_ADDR: ":9090"
    depends_on:
      migrate-email:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    ports:
      - "${AIWORKER_HOST_METRICS_PORT:-9092}:8080"
    command: ["/app/aiworker"]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/grafana-dashboard.json:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    networks: [backend]
    restart: unless-stopped
